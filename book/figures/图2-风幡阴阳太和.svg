<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" role="img" aria-label="风幡阴阳太和图">
  <defs>
    <style>
      .ttl{font-family:"Noto Serif SC","Songti SC",serif;font-size:25px;fill:#25211D;letter-spacing:.12em}
      .sub{font-family:"Noto Serif SC","Songti SC",serif;font-size:13px;fill:#7C6D5C;letter-spacing:.08em}
      .cap{font-family:"Noto Serif SC","Songti SC",serif;font-size:15px;fill:#3B352F;letter-spacing:.05em}
      .lab{font-family:"Noto Serif SC","Songti SC",serif;font-size:17px;fill:#25211D;letter-spacing:.1em}
      .small{font-family:"Noto Serif SC","Songti SC",serif;font-size:12.5px;fill:#7C6D5C;letter-spacing:.04em}
      .ochre{fill:#994433}
      .rul{stroke:#DCD5C8;stroke-width:1}
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#FCFAF6"/>
  <text class="ttl" x="450" y="52" text-anchor="middle">风幡阴阳太和</text>
  <text class="sub" x="450" y="78" text-anchor="middle">幡为阴 · 风为阳 · 心为涵摄阴阳之太和</text>
  <line x1="60" y1="96" x2="840" y2="96" class="rul"/>

  <!-- 左：幡（阴） -->
  <text class="cap ochre" x="132" y="132" text-anchor="middle">幡　有形之相　阴</text>
  <g stroke="#7C6D5C" stroke-width="1.6" fill="#EDE4D4">
    <rect x="60" y="150" width="9" height="250"/>
    <path d="M69 158 L188 158 L188 300 Q128 318 69 300 Z" fill="#E4D8C3"/>
  </g>
  <text class="lab" x="128" y="238" text-anchor="middle">幡</text>
  <text class="small" x="128" y="262" text-anchor="middle">有边界 · 可执取</text>
  <text class="small" x="66" y="424">僧甲：执「幡动」一端</text>

  <!-- 右：风（阳） -->
  <text class="cap ochre" x="722" y="132" text-anchor="middle">风　无形之能　阳</text>
  <g stroke="#994433" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M676 178 q46 -20 92 0 q46 20 92 0"/>
    <path d="M676 212 q46 -22 92 0 q46 22 92 0"/>
    <path d="M676 246 q46 -22 92 0 q46 22 92 0"/>
    <path d="M676 280 q46 -22 92 0 q46 20 92 0"/>
  </g>
  <text class="lab" x="722" y="316" text-anchor="middle">风</text>
  <text class="small" x="722" y="340" text-anchor="middle">无定相 · 有动能</text>
  <text class="small" x="660" y="424">僧乙：执「风动」一端</text>

  <!-- 中：太和之心 -->
  <circle cx="450" cy="250" r="88" fill="#F7F4EE" stroke="#994433" stroke-width="1.6"/>
  <circle cx="450" cy="250" r="74" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <text class="lab" x="450" y="238" text-anchor="middle">心</text>
  <text class="small" x="450" y="264" text-anchor="middle">太和 · 非心</text>
  <text class="small" x="450" y="284" text-anchor="middle">不住阴 · 不住阳</text>

  <!-- 双箭头：阴阳入太和 -->
  <g stroke="#7C6D5C" stroke-width="1.5" fill="none">
    <path d="M190 280 Q280 250 356 250" marker-end="url(#ar)"/>
    <path d="M676 280 Q612 250 544 250" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7C6D5C"/>
    </marker>
  </defs>

  <!-- 下方：合 / 和 两判 -->
  <line x1="60" y1="446" x2="840" y2="446" class="rul"/>

  <text class="cap ochre" x="60" y="482">合　二僧之诤</text>
  <text class="small" x="60" y="508">一执阴（幡）、一执阳（风），各取一边，割裂一体。</text>
  <text class="small" x="60" y="530">争「谁在动」，境界如实显现，人心另立二元。</text>
  <text class="small" x="60" y="552">虽在论法，仍落能所、是非、胜负，是人为之合。</text>

  <text class="cap ochre" x="500" y="482">和　仁者心动</text>
  <text class="small" x="500" y="508">不是风动，不是幡动：非否定现象，是不取一端。</text>
  <text class="small" x="500" y="530">心能涵摄阴阳，照见而不攀附，故曰太和。</text>
  <text class="small" x="500" y="552">此心非心，故名此心；应无所住，而生其心。</text>

  <line x1="60" y1="576" x2="840" y2="576" class="rul"/>
  <text class="sub" x="450" y="602" text-anchor="middle">「心动」非妄念纷飞——是太和之心的照用；把心动读成念头扰动，即错解。</text>
</svg>
